name: CI

on:
  workflow_dispatch: ~
  pull_request: ~
  push: ~

jobs:
  dependency-validation:
    name: Dependency validation

    if: false

    env:
      PHP_VERSION: 8.3
      PHP_EXTENSIONS: none, ctype, curl, dom, fileinfo, iconv, intl, json, libxml, mbstring, mysqli, openssl, pgsql, simplexml, tokenizer, xml, xmlwriter, zip

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer

      - name: Ensure that composer.json is valid
        run: composer validate --no-ansi --strict composer.json

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            php-${{ env.PHP_VERSION }}-composer-

      - name: Ensure that dependencies can be installed
        run: composer install --no-ansi

  # Disabled: Code-style checker (skipped on purpose)
  code-style-checker:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "code-style-checker skipped"

  type-checker:
    name: Type checker

    if: false

    env:
      PHP_VERSION: 8.3
      PHP_EXTENSIONS: none, ctype, curl, dom, fileinfo, iconv, intl, json, libxml, mbstring, mysqli, openssl, pgsql, simplexml, tokenizer, xml, xmlwriter, zip

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            php-${{ env.PHP_VERSION }}-composer-

      - name: Install dependencies with Composer
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          path: "var/cache/tools/phpstan"
          key: "phpstan-${{ github.run_id }}"
          restore-keys: |
            phpstan-

      - name: Run PHPStan
        run: lib/vendor/bin/phpstan --no-progress -n

  compatibility-checker:
    name: Compatibility checker

    if: false

    env:
      PHP_VERSION: 8.3
      PHP_EXTENSIONS: none, ctype, curl, dom, fileinfo, iconv, intl, json, libxml, mbstring, mysqli, openssl, pgsql, simplexml, tokenizer, xml, xmlwriter, zip

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            php-${{ env.PHP_VERSION }}-composer-

      - name: Install dependencies with Composer
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run phpcs
        run: lib/vendor/bin/phpcs -qs

  # Disabled: Refactoring checker (skipped on purpose)
  refactoring-checker:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "refactoring-checker skipped"

  # Disabled: Post commit hooks (skipped on purpose)
  post-commit:
    if: false
    runs-on: ubuntu-24.04
    outputs:
      next: skip

  trigger-tests:
    name: Trigger tests

    if: false

    runs-on: ubuntu-24.04
    steps:
      - run: echo "trigger-tests skipped"

  upload-to-crowdin:
    name: Upload translation sources

    if: false

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: echo "upload-to-crowdin skipped"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    env:
      PHP_VERSION: 8.2
      PHP_EXTENSIONS: none, ctype, curl, dom, fileinfo, iconv, intl, json, libxml, mbstring, mysqli, openssl, pgsql, simplexml, tokenizer, xml, xmlwriter, zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=-1
          tools: composer

      - name: Install ant 1.7
        run: |
          curl -s -O http://archive.debian.org/debian-archive/debian/pool/main/a/ant1.7/ant1.7_1.7.1-7_all.deb
          curl -s -O http://archive.debian.org/debian-archive/debian/pool/main/a/ant1.7/ant1.7-optional_1.7.1-7_all.deb
          sudo apt-get -y -qq remove ant
          sudo apt-get -y -qq install libxerces2-java
          sudo dpkg -i ant1.7_1.7.1-7_all.deb
          sudo dpkg -i ant1.7-optional_1.7.1-7_all.deb
          rm *.deb

      - name: Build package
        run: ant package -Dversion=ci

      - name: Find package
        id: package
        run: |
          PKG=$(ls build/test-results/revive-adserver-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            PKG=$(ls build/test-results/revive-adserver-*.zip 2>/dev/null | head -1)
          fi
          if [ -z "$PKG" ]; then
            echo "No package found"; exit 1
          fi
          echo "path=$PKG" >> $GITHUB_OUTPUT
          echo "Using package: $PKG"

      - name: Build Docker image
        run: |
          docker build \
            -t revive-adserver:ci \
            --build-arg PACKAGE_PATH=${{ steps.package.outputs.path }} \
            .
