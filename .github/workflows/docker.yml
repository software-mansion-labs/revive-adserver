name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        default: "latest"
        description: "Release version (default: latest)"
      gitlab_registry:
        type: string
        required: false
        default: "registry.swmansion.com/devops/custom-docker-images"
        description: "GitLab Container Registry URL (default: SWM registry)"
      push_image:
        type: boolean
        default: true
        description: Push image to GitLab registry
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  release:
    types: [published]

env:
  PHP_VERSION: 8.2
  PHP_EXTENSIONS: none, ctype, curl, dom, fileinfo, iconv, intl, json, libxml, mbstring, mysqli, openssl, pgsql, simplexml, tokenizer, xml, xmlwriter, zip

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=-1
          tools: composer

      - name: Install ant 1.7
        run: |
          curl -s -O http://archive.debian.org/debian-archive/debian/pool/main/a/ant1.7/ant1.7_1.7.1-7_all.deb
          curl -s -O http://archive.debian.org/debian-archive/debian/pool/main/a/ant1.7/ant1.7-optional_1.7.1-7_all.deb
          sudo apt-get -y -qq remove ant
          sudo apt-get -y -qq install libxerces2-java
          sudo dpkg -i ant1.7_1.7.1-7_all.deb
          sudo dpkg -i ant1.7-optional_1.7.1-7_all.deb
          rm *.deb

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            php-${{ env.PHP_VERSION }}-composer-

      - name: Build package
        run: ant package -Dversion=${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitLab Container Registry
        if: ${{ github.event.inputs.push_image == 'true' || github.event_name != 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.gitlab_registry != '' && github.event.inputs.gitlab_registry || 'registry.swmansion.com/devops/custom-docker-images' }}
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Extract registry and image name
        id: image
        run: |
          if [ -n "${{ github.event.inputs.gitlab_registry }}" ]; then
            REGISTRY="${{ github.event.inputs.gitlab_registry }}"
          else
            REGISTRY="registry.swmansion.com/devops/custom-docker-images"
          fi

          # Image name: prefer secret override, else fixed 'revive-adserver'
          if [ -n "${{ secrets.GITLAB_IMAGE_NAME }}" ]; then
            IMAGE_NAME="${{ secrets.GITLAB_IMAGE_NAME }}"
          else
            IMAGE_NAME="revive-adserver"
          fi

          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "tag_latest=${REGISTRY}/${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          echo "Building image: ${FULL_IMAGE}"

      - name: Find package file
        id: package
        run: |
          PACKAGE=$(ls build/test-results/revive-adserver-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$PACKAGE" ]; then
            PACKAGE=$(ls build/test-results/revive-adserver-*.zip 2>/dev/null | head -1)
          fi
          if [ -z "$PACKAGE" ]; then
            echo "Error: No package file found!"
            exit 1
          fi
          echo "package=${PACKAGE}" >> $GITHUB_OUTPUT
          echo "Found package: ${PACKAGE}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event.inputs.push_image == 'true' || github.event_name != 'workflow_dispatch' }}
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.tag_latest }}
          build-args: |
            PACKAGE_PATH=${{ steps.package.outputs.package }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
